# ===============================
# APLICACIÓN
# ===============================
spring.application.name=conveo

# ===============================
# SERVER
# ===============================
server.port=9000

# ===============================
# DATASOURCE (MySQL)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/conveo_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=150897
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
allowPublicKeyRetrieval=true

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# LOGGING
# ===============================
logging.level.root=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.web.resources.chain.enabled=true

# ===============================
# MAIL
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TU-USUARIO-GMAIL
spring.mail.password=TU-CONTRASEÑA-APLICACION
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true