<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Nuevo Centro')}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0">Nuevo Centro</h1>
            <a class="btn btn-outline-secondary" th:href="@{/centros}">Volver</a>
        </div>

        <div class="card">
            <div class="card-body">

                <form th:action="@{/centros/guardar}" th:object="${centro}" method="post" class="row g-3">

                    <input type="hidden" th:field="*{id}" />

                    <div class="col-12 col-md-6">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" placeholder="Nombre del centro" />
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Ubicación</label>
                        <input type="text" class="form-control" th:field="*{ubicacion}"
                            placeholder="Ciudad / dirección" />
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Email de contacto</label>
                        <input type="email" class="form-control" th:field="*{emailContacto}"
                            placeholder="contacto@centro.com" />
                    </div>

                    <div class="col-12">
                        <hr class="my-2" />
                        <h5 class="mb-3">Titulaciones</h5>

                        <div class="row g-2">
                            <div class="col-12 col-md-6 col-lg-4" th:each="t : ${titulaciones}">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="titulacionIds"
                                        th:value="${t.id}" th:checked="${asignadas.contains(t.id)}"
                                        th:id="${'tit_' + t.id}" />
                                    <label class="form-check-label" th:for="${'tit_' + t.id}">
                                        <span th:text="${t.nombre + ' (' + t.nivel + ')'}"></span>

                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/centros}">Cancelar</a>
                    </div>

                </form>

            </div>
        </div>

    </div>

</body>

</html>
