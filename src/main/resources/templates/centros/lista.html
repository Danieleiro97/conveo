<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Centros')}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0">Centros</h1>
            <a class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN','RRHH')" th:href="@{/centros/nuevo}">
                Nuevo Centro
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 70px;">ID</th>
                                <th>Nombre</th>
                                <th>Ubicación</th>
                                <th>Email</th>
                                <th>Titulaciones</th>
                                <th style="width: 90px;">Activo</th>
                                <th style="width: 260px;">Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:if="${#lists.isEmpty(centros)}">
                                <td colspan="7" class="text-center py-4">
                                    No hay centros para mostrar.
                                </td>
                            </tr>

                            <tr th:each="c : ${centros}">
                                <td th:text="${c.id}"></td>
                                <td th:text="${c.nombre}"></td>
                                <td th:text="${c.ubicacion}"></td>
                                <td th:text="${c.emailContacto}"></td>

                                <td
                                    th:text="${#strings.isEmpty(titulacionesPorCentro[c.id]) ? '—' : titulacionesPorCentro[c.id]}">
                                </td>

                                <td th:text="${c.activo ? 'Sí' : 'No'}"></td>

                                <td>
                                    <div class="d-flex flex-wrap gap-2">

                                        <a class="btn btn-sm btn-outline-secondary"
                                            th:href="@{/centros/{id}(id=${c.id})}">Ver</a>

                                        <a class="btn btn-sm btn-outline-primary"
                                            sec:authorize="hasAnyRole('ADMIN','RRHH')"
                                            th:href="@{/centros/editar/{id}(id=${c.id})}">Editar</a>

                                        <!-- Dar de baja: solo si está activo -->
                                        <form th:if="${c.activo}" th:action="@{/centros/eliminar/{id}(id=${c.id})}"
                                            method="post" style="display:inline;">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                                onclick="return confirm('¿Dar de baja este centro?')">
                                                Dar de baja
                                            </button>
                                        </form>

                                        <!-- Dar de alta: solo si está inactivo -->
                                        <form th:if="${!c.activo}" th:action="@{/centros/activar/{id}(id=${c.id})}"
                                            method="post" style="display:inline;">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-outline-success"
                                                onclick="return confirm('¿Dar de alta este centro?')">
                                                Dar de alta
                                            </button>
                                        </form>

                                    </div>
                                </td>
                            </tr>
                        </tbody>

                    </table>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
