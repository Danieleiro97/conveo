<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Detalle convenio')}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="mb-0">Detalle de convenio</h1>
                <div class="text-muted" th:text="${convenio.nombre}"></div>
            </div>

            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/convenios}">Volver</a>
                <a class="btn btn-outline-primary" sec:authorize="hasAnyRole('ADMIN','RRHH')"
                    th:href="@{/convenios/editar/{id}(id=${convenio.id})}">
                    Editar convenio
                </a>
            </div>
        </div>

        <!-- Datos del convenio -->
        <div class="card mb-4">
            <div class="card-header">
                <b>Datos del convenio</b>
            </div>
            <div class="card-body">
                <div class="row g-3">

                    <div class="col-12 col-md-3">
                        <div class="text-muted">ID</div>
                        <div th:text="${convenio.id}"></div>
                    </div>

                    <div class="col-12 col-md-5">
                        <div class="text-muted">Centro</div>
                        <div th:text="${convenio.centro != null ? convenio.centro.nombre : '—'}"></div>
                    </div>

                    <div class="col-6 col-md-2">
                        <div class="text-muted">Inicio</div>
                        <div th:text="${convenio.fechaInicio != null ? convenio.fechaInicio : '—'}"></div>
                    </div>

                    <div class="col-6 col-md-2">
                        <div class="text-muted">Fin</div>
                        <div th:text="${convenio.fechaFin != null ? convenio.fechaFin : '—'}"></div>
                    </div>

                    <div class="col-12 col-md-2">
                        <div class="text-muted">Activo</div>
                        <div th:text="${convenio.activo ? 'Sí' : 'No'}"></div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Estudiantes asociados -->
        <div class="card mb-4">
            <div class="card-header">
                <b>Estudiantes asociados</b>
            </div>

            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Estudiante</th>
                                <th>Email</th>
                                <th style="width: 90px;">Activo</th>
                                <th style="width: 220px;">Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:if="${#lists.isEmpty(estudiantes)}">
                                <td colspan="4" class="text-center py-4">
                                    No hay estudiantes asociados a este convenio.
                                </td>
                            </tr>

                            <tr th:each="e : ${estudiantes}">
                                <td th:text="${e.nombre} + ' ' + ${e.apellidos}"></td>
                                <td th:text="${e.email}"></td>
                                <td th:text="${e.activo ? 'Sí' : 'No'}"></td>
                                <td>
                                    <div class="d-flex flex-wrap gap-2">
                                        <a class="btn btn-sm btn-outline-secondary"
                                            th:href="@{/estudiantes/{id}(id=${e.id})}">
                                            Ver
                                        </a>

                                        <a class="btn btn-sm btn-outline-primary"
                                            sec:authorize="hasAnyRole('ADMIN','RRHH')"
                                            th:href="@{/estudiantes/editar/{id}(id=${e.id})}">
                                            Editar
                                        </a>
                                    </div>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>
            </div>

        </div>

    </div>

</body>

</html>
