<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Detalle convenio</title>
</head>

<body>

    <div th:replace="fragments/navbar :: navbar"></div>

    <h1>Detalle de convenio</h1>

    <h2 th:text="${convenio.nombre}"></h2>

    <p><b>ID:</b> <span th:text="${convenio.id}"></span></p>

    <p><b>Centro:</b>
        <span th:text="${convenio.centro != null ? convenio.centro.nombre : '—'}"></span>
    </p>

    <p><b>Fecha inicio:</b>
        <span th:text="${convenio.fechaInicio != null ? convenio.fechaInicio : '—'}"></span>
    </p>

    <p><b>Fecha fin:</b>
        <span th:text="${convenio.fechaFin != null ? convenio.fechaFin : '—'}"></span>
    </p>

    <p><b>Activo:</b>
        <span th:text="${convenio.activo ? 'Sí' : 'No'}"></span>
    </p>

    <hr />

    <h3>Estudiantes asociados</h3>

    <table border="1" style="width:100%; border-collapse:collapse;">
        <tr>
            <th>Estudiante</th>
            <th>Email</th>
            <th>Activo</th>
            <th>Acciones</th>
        </tr>

        <tr th:if="${#lists.isEmpty(estudiantes)}">
            <td colspan="4">No hay estudiantes asociados a este convenio.</td>
        </tr>

        <tr th:each="e : ${estudiantes}">
            <td th:text="${e.nombre} + ' ' + ${e.apellidos}"></td>
            <td th:text="${e.email}"></td>
            <td th:text="${e.activo ? 'Sí' : 'No'}"></td>
            <td>
                <a th:href="@{/estudiantes/{id}(id=${e.id})}">Ver</a>
                |
                <a th:href="@{/estudiantes/editar/{id}(id=${e.id})}">Editar</a>
            </td>
        </tr>
    </table>

    <br />

    <a th:href="@{/convenios/editar/{id}(id=${convenio.id})}">Editar convenio</a>
    |
    <a th:href="@{/convenios}">Volver al listado</a>

</body>

</html>
