<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Nuevo Convenio')}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0">Nuevo Convenio</h1>
            <a class="btn btn-outline-secondary" th:href="@{/convenios}">Volver</a>
        </div>

        <!-- Error de regla -->
        <div th:if="${errorRegla != null}" class="alert alert-danger" role="alert">
            <span th:text="${errorRegla}"></span>
        </div>

        <div class="card">
            <div class="card-body">

                <form th:action="@{/convenios/guardar}" th:object="${convenio}" method="post" class="row g-3">

                    <input type="hidden" th:field="*{id}" />

                    <div class="col-12 col-md-6">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}"
                            placeholder="Nombre del convenio" />
                    </div>

                    <div class="col-12 col-md-3">
                        <label class="form-label">Fecha inicio</label>
                        <input type="date" class="form-control" th:field="*{fechaInicio}" />
                    </div>

                    <div class="col-12 col-md-3">
                        <label class="form-label">Fecha fin</label>
                        <input type="date" class="form-control" th:field="*{fechaFin}" />
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Centro</label>
                        <select class="form-select" name="centroId">
                            <option value="">-- Selecciona un centro --</option>
                            <option th:each="c : ${centros}" th:value="${c.id}" th:text="${c.nombre}"
                                th:selected="${convenio.centro != null and convenio.centro.id == c.id}">
                            </option>
                        </select>
                    </div>

                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/convenios}">Cancelar</a>
                    </div>

                </form>

            </div>
        </div>

    </div>

</body>

</html>
