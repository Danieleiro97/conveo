<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Nuevo Convenio</title>
</head>

<body>

    <h1>Nuevo Convenio</h1>

    <form th:action="@{/convenios/guardar}" th:object="${convenio}" method="post">

        <input type="hidden" th:field="*{id}" />

        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" /><br />

        <label>Fecha inicio:</label>
        <input type="date" th:field="*{fechaInicio}" /><br />

        <label>Fecha fin:</label>
        <input type="date" th:field="*{fechaFin}" /><br />

        <label>Centro:</label>
        <select name="centroId">
            <option value="">-- Selecciona un centro --</option>
            <option th:each="c : ${centros}" th:value="${c.id}" th:text="${c.nombre}"
                th:selected="${convenio.centro != null and convenio.centro.id == c.id}">
            </option>
        </select><br />

        <label>Titulación:</label>
        <select name="titulacionId">
            <option value="">-- Selecciona una titulación --</option>
            <option th:each="t : ${titulaciones}" th:value="${t.id}" th:text="${t.nombre}"
                th:selected="${convenio.titulacion != null and convenio.titulacion.id == t.id}">
            </option>
        </select><br />

        <button type="submit">Guardar</button>
    </form>

    <a th:href="@{/convenios}">Volver</a>

</body>

</html>
