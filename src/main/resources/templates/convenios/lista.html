<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Convenios')}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0">Listado de Convenios</h1>

            <a class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN','RRHH')"
               th:href="@{/convenios/nuevo}">
                Nuevo Convenio
            </a>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 70px;">ID</th>
                                <th>Nombre</th>
                                <th>Centro</th>
                                <th style="width: 130px;">Inicio</th>
                                <th style="width: 130px;">Fin</th>
                                <th style="width: 90px;">Activo</th>
                                <th style="width: 260px;">Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:if="${#lists.isEmpty(convenios)}">
                                <td colspan="7" class="text-center py-4">
                                    No hay convenios para mostrar.
                                </td>
                            </tr>

                            <tr th:each="c : ${convenios}">
                                <td th:text="${c.id}"></td>
                                <td th:text="${c.nombre}"></td>
                                <td th:text="${c.centro != null ? c.centro.nombre : '—'}"></td>

                                <td th:text="${c.fechaInicio != null ? c.fechaInicio : '—'}"></td>
                                <td th:text="${c.fechaFin != null ? c.fechaFin : '—'}"></td>

                                <td th:text="${c.activo ? 'Sí' : 'No'}"></td>

                                <td>
                                    <div class="d-flex flex-wrap gap-2">

                                        <a class="btn btn-sm btn-outline-secondary"
                                           th:href="@{/convenios/{id}(id=${c.id})}">
                                            Ver
                                        </a>

                                        <a class="btn btn-sm btn-outline-primary"
                                           sec:authorize="hasAnyRole('ADMIN','RRHH')"
                                           th:href="@{/convenios/editar/{id}(id=${c.id})}">
                                            Editar
                                        </a>

                                        <a class="btn btn-sm btn-outline-danger"
                                           sec:authorize="hasRole('ADMIN')"
                                           th:href="@{/convenios/eliminar/{id}(id=${c.id})}"
                                           onclick="return confirm('¿Seguro que deseas eliminar este convenio?');">
                                            Eliminar
                                        </a>

                                    </div>
                                </td>
                            </tr>
                        </tbody>

                    </table>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
