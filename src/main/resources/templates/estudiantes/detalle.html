<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Detalle estudiante')}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="mb-0">Ficha de estudiante</h1>
                <div class="text-muted" th:text="${estudiante.nombre + ' ' + estudiante.apellidos}"></div>
            </div>

            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" th:href="@{/estudiantes}">Volver</a>

                <a class="btn btn-outline-primary" sec:authorize="hasAnyRole('ADMIN','RRHH')"
                    th:href="@{/estudiantes/editar/{id}(id=${estudiante.id})}">
                    Editar
                </a>

                <a class="btn btn-outline-info" sec:authorize="hasAnyRole('ADMIN','RRHH')"
                    th:href="@{/estudiantes/{id}/historial-tutor(id=${estudiante.id})}">
                    Historial tutor
                </a>
            </div>
        </div>

        <!-- Datos personales -->
        <div class="card mb-4">
            <div class="card-header">
                <b>Datos personales</b>
            </div>
            <div class="card-body">
                <div class="row g-3">

                    <div class="col-12 col-md-2">
                        <div class="text-muted">ID</div>
                        <div th:text="${estudiante.id}"></div>
                    </div>

                    <div class="col-12 col-md-4">
                        <div class="text-muted">Email</div>
                        <div th:text="${estudiante.email != null ? estudiante.email : '—'}"></div>
                    </div>

                    <div class="col-12 col-md-3">
                        <div class="text-muted">Teléfono</div>
                        <div th:text="${estudiante.telefono != null ? estudiante.telefono : '—'}"></div>
                    </div>

                    <div class="col-12 col-md-3">
                        <div class="text-muted">DNI</div>
                        <div th:text="${estudiante.dni != null ? estudiante.dni : '—'}"></div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Centro / titulación / convenio -->
        <div class="card mb-4">
            <div class="card-header">
                <b>Asignación académica</b>
            </div>
            <div class="card-body">
                <div class="row g-3">

                    <div class="col-12 col-md-4">
                        <div class="text-muted">Centro</div>
                        <div th:text="${estudiante.centro != null ? estudiante.centro.nombre : '—'}"></div>
                    </div>

                    <div class="col-12 col-md-4">
                        <div class="text-muted">Titulación</div>
                        <div th:text="${estudiante.titulacion != null ? estudiante.titulacion.nombre : '—'}"></div>
                    </div>

                    <div class="col-12 col-md-4">
                        <div class="text-muted">Convenio</div>
                        <div th:text="${estudiante.convenio != null ? estudiante.convenio.nombre : '—'}"></div>
                    </div>

                    <div class="col-12">
                        <div class="text-muted">Tutor empresa actual</div>
                        <div
                            th:text="${estudiante.tutorEmpresa != null ? estudiante.tutorEmpresa.nombre + ' ' + estudiante.tutorEmpresa.apellidos : 'Sin tutor asignado'}">
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Prácticas -->
        <div class="card mb-4">
            <div class="card-header">
                <b>Prácticas</b>
            </div>
            <div class="card-body">
                <div class="row g-3">

                    <div class="col-6 col-md-3">
                        <div class="text-muted">Inicio prácticas</div>
                        <div
                            th:text="${estudiante.fechaInicioPracticas != null ? estudiante.fechaInicioPracticas : '—'}">
                        </div>
                    </div>

                    <div class="col-6 col-md-3">
                        <div class="text-muted">Fin prácticas</div>
                        <div th:text="${estudiante.fechaFinPracticas != null ? estudiante.fechaFinPracticas : '—'}">
                        </div>
                    </div>

                    <div class="col-12 col-md-3">
                        <div class="text-muted">Activo</div>
                        <div th:text="${estudiante.activo ? 'Sí' : 'No'}"></div>
                    </div>

                </div>
            </div>
        </div>
        <!-- Mensaje flash de éxito -->
        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
            <span th:text="${mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Botón recordatorio: solo visible si quedan entre 0 y 15 días y hay tutor asignado -->
        <div th:if="${diasRestantes != null
             and diasRestantes <= 15
             and diasRestantes >= 0
             and estudiante.tutorEmpresa != null}" sec:authorize="hasAnyRole('ADMIN','RRHH')" class="mb-4">
            <form th:action="@{/estudiantes/{id}/recordatorio(id=${estudiante.id})}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-warning">
                    ⚠️ Enviar recordatorio al tutor de empresa
                </button>
            </form>
        </div>
    </div>

</body>

</html>
