<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Estudiantes</title>
</head>

<body>

    <h1>Listado de Estudiantes</h1>

    <a th:href="@{/estudiantes/nuevo}">Nuevo Estudiante</a>

    <table border="1">
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Convenio</th>
            <th>Acciones</th>
        </tr>
        <tr th:each="e : ${estudiantes}">
            <td th:text="${e.id}"></td>
            <td th:text="${e.nombre} + ' ' + ${e.apellidos}"></td>
            <td th:text="${e.email}"></td>
            <td th:text="${e.convenio != null ? e.convenio.nombre : 'Sin convenio'}"></td>
            <td>
                <a th:href="@{/estudiantes/editar/{id}(id=${e.id})}">Editar</a>
                |
                <a th:href="@{/estudiantes/eliminar/{id}(id=${e.id})}"
                    onclick="return confirm('¿Eliminar estudiante?');">
                    Eliminar
                </a>
            </td>
        </tr>
    </table>

</body>

</html>
