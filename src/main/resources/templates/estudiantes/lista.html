<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Estudiantes')}"></head>


<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0">Listado de Estudiantes</h1>
            <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show mt-3" role="alert">
                <span th:text="${mensajeExito}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <a class="btn btn-primary" sec:authorize="hasAnyRole('ADMIN','RRHH')" th:href="@{/estudiantes/nuevo}">
                Nuevo Estudiante
            </a>

        </div>

        <div class="card mb-4">
            <div class="card-header">
                <b>Filtros</b>
            </div>
            <div class="card-body">
                <form th:action="@{/estudiantes}" method="get" class="row g-3 align-items-end">

                    <div class="col-12 col-md-4 col-lg-3">
                        <label class="form-label">Centro</label>
                        <select class="form-select" name="centroId">
                            <option value="">-- Todos --</option>
                            <option th:each="c : ${centros}" th:value="${c.id}" th:text="${c.nombre}"
                                th:selected="${centroId != null and centroId == c.id}">
                            </option>
                        </select>
                    </div>

                    <div class="col-12 col-md-4 col-lg-3">
                        <label class="form-label">Titulación</label>
                        <select class="form-select" name="titulacionId">
                            <option value="">-- Todas --</option>
                            <option th:each="t : ${titulaciones}" th:value="${t.id}" th:text="${t.nombre}"
                                th:selected="${titulacionId != null and titulacionId == t.id}">
                            </option>
                        </select>
                    </div>

                    <div class="col-12 col-md-4 col-lg-3">
                        <label class="form-label">Convenio</label>
                        <select class="form-select" name="convenioId">
                            <option value="">-- Todos --</option>
                            <option th:each="cv : ${convenios}" th:value="${cv.id}" th:text="${cv.nombre}"
                                th:selected="${convenioId != null and convenioId == cv.id}">
                            </option>
                        </select>
                    </div>

                    <div class="col-6 col-md-4 col-lg-2">
                        <label class="form-label">Activo</label>
                        <select class="form-select" name="activo">
                            <option value="" th:selected="${activo == null}">-- Todos --</option>
                            <option value="true" th:selected="${activo != null and activo}">Sí</option>
                            <option value="false" th:selected="${activo != null and !activo}">No</option>
                        </select>
                    </div>

                    <div class="col-6 col-md-4 col-lg-2">
                        <label class="form-label">Tutor asignado</label>
                        <select class="form-select" name="tutorAsignado">
                            <option value="" th:selected="${tutorAsignado == null}">-- Todos --</option>
                            <option value="true" th:selected="${tutorAsignado != null and tutorAsignado}">Sí</option>
                            <option value="false" th:selected="${tutorAsignado != null and !tutorAsignado}">No</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-4 col-lg-2 d-flex gap-2">
                        <button type="submit" class="btn btn-success w-100">Aplicar</button>
                        <a th:href="@{/estudiantes}" class="btn btn-outline-secondary w-100">Limpiar</a>
                    </div>

                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th style="width: 70px;">ID</th>
                                <th>Nombre</th>
                                <th>Centro</th>
                                <th>Titulación</th>
                                <th>Tutor empresa</th>
                                <th style="width: 130px;">Inicio</th>
                                <th style="width: 130px;">Fin</th>
                                <th style="width: 100px;">Estado</th>
                                <th style="width: 260px;">Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:if="${#lists.isEmpty(estudiantes)}">
                                <td colspan="9" class="text-center py-4">
                                    No hay estudiantes para los filtros seleccionados.
                                </td>
                            </tr>

                            <tr th:each="e : ${estudiantes}">
                                <td th:text="${e.id}"></td>
                                <td th:text="${e.nombre + ' ' + e.apellidos}"></td>
                                <td th:text="${e.centro != null ? e.centro.nombre : '—'}"></td>
                                <td th:text="${e.titulacion != null ? e.titulacion.nombre : '—'}"></td>
                                <td
                                    th:text="${e.tutorEmpresa != null ? e.tutorEmpresa.nombre + ' ' + e.tutorEmpresa.apellidos : '—'}">
                                </td>

                                <td
                                    th:text="${e.fechaInicioPracticas != null ? #temporals.format(e.fechaInicioPracticas, 'dd/MM/yyyy') : '—'}">
                                </td>
                                <td
                                    th:text="${e.fechaFinPracticas != null ? #temporals.format(e.fechaFinPracticas, 'dd/MM/yyyy') : '—'}">
                                </td>
                                <td>
                                    <span class="badge" th:classappend="${e.activo ? ' bg-success' : ' bg-secondary'}"
                                        th:text="${e.activo ? 'ACTIVO' : 'BAJA'}">
                                    </span>
                                </td>
                                <td>
                                    <div class="d-flex flex-wrap gap-2">

                                        <a class="btn btn-sm btn-outline-secondary"
                                            th:href="@{/estudiantes/{id}(id=${e.id})}">Ver</a>


                                        <a class="btn btn-sm btn-outline-primary"
                                            sec:authorize="hasAnyRole('ADMIN','RRHH')"
                                            th:href="@{/estudiantes/editar/{id}(id=${e.id})}">Editar</a>


                                        <a class="btn btn-sm btn-outline-info"
                                            sec:authorize="hasAnyRole('ADMIN','RRHH')"
                                            th:href="@{/estudiantes/{id}/historial-tutor(id=${e.id})}">Historial</a>

                                        <!-- Botón recordatorio: solo si quedan entre 0 y 15 días y tiene tutor asignado -->
                                        <form th:if="${diasRestantesMap[e.id] != null
              and diasRestantesMap[e.id] <= 15
              and diasRestantesMap[e.id] >= 0
              and e.tutorEmpresa != null}" sec:authorize="hasAnyRole('ADMIN','RRHH')"
                                            th:action="@{/estudiantes/{id}/recordatorio(id=${e.id}, origen='lista')}"
                                            method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}" />
                                            <button type="submit" class="btn btn-sm btn-warning">
                                                Enviar Recordatorio al Tutor
                                            </button>
                                        </form>
                                        <form sec:authorize="hasRole('ADMIN')" th:if="${e.activo}"
                                            th:action="@{/estudiantes/eliminar/{id}(id=${e.id})}" method="post"
                                            class="d-inline" onsubmit="return confirm('¿Dar de baja al estudiante?');">

                                            <input type="hidden" th:name="${_csrf.parameterName}"
                                                th:value="${_csrf.token}" />

                                            <button type="submit" class="btn btn-sm btn-outline-danger">
                                                Dar de baja
                                            </button>
                                        </form>

                                    </div>
                                </td>

                            </tr>
                        </tbody>

                    </table>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
