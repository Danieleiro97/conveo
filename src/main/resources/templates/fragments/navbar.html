<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">

            <a class="navbar-brand" th:href="@{/}">CONVEO</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarConveo"
                aria-controls="navbarConveo" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarConveo">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <!-- ADMIN -->
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/centros}">Centros</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/convenios}">Convenios</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/estudiantes}">Estudiantes</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/titulaciones}">Titulaciones</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/tutores-empresa}">Tutores empresa</a>
                    </li>

                    <!-- RRHH -->
                    <li class="nav-item" sec:authorize="hasRole('RRHH')">
                        <a class="nav-link" th:href="@{/estudiantes}">Estudiantes</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('RRHH')">
                        <a class="nav-link" th:href="@{/tutores-empresa}">Tutores empresa</a>
                    </li>

                    <!-- TUTOR_EMPRESA -->
                    <li class="nav-item" sec:authorize="hasRole('TUTOR_EMPRESA')">
                        <a class="nav-link" th:href="@{/mis-estudiantes}">Mis estudiantes</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('TUTOR_EMPRESA')">
                        <a class="nav-link" th:href="@{/mi-historial-estudiantes}">Historial estudiantes</a>
                    </li>

                </ul>

                <!-- Usuario + Logout -->
                <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                    <span class="text-light me-3">
                        Usuario: <b sec:authentication="name"></b>
                    </span>

                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-light btn-sm">Salir</button>
                    </form>
                </div>

            </div>
        </div>
    </nav>

</body>

</html>
