<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Iniciar sesión')}"></head>

<body class="bg-light">

  <div class="container d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="col-12 col-sm-8 col-md-5 col-lg-4">

      <!-- Logo / título -->
      <div class="text-center mb-4">
        <h2 class="fw-bold">Conveo</h2>
        <p class="text-muted">Gestión de convenios de prácticas</p>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">

          <h5 class="card-title mb-4">Iniciar sesión</h5>

          <!-- Error de credenciales -->
          <div th:if="${param.error}" class="alert alert-danger">
            Usuario o contraseña incorrectos.
          </div>

          <!-- Mensaje de logout -->
          <div th:if="${param.logout}" class="alert alert-success">
            Has cerrado sesión correctamente.
          </div>

          <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="mb-3">
              <label for="username" class="form-label">Usuario</label>
              <input type="text" class="form-control" id="username" name="username"
                     placeholder="Introduce tu usuario" autofocus required/>
            </div>

            <div class="mb-4">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="password" name="password"
                     placeholder="Introduce tu contraseña" required/>
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Entrar
            </button>

          </form>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
