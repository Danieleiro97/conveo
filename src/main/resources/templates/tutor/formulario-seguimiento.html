<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Registrar seguimiento')}"></head>

<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="mb-0">Registrar seguimiento</h1>
                <span class="text-muted" th:text="${estudiante.nombre + ' ' + estudiante.apellidos}"></span>
            </div>
            <a class="btn btn-outline-secondary" th:href="@{/mis-estudiantes/{id}(id=${estudiante.id})}">Volver</a>
        </div>

        <div class="card">
            <div class="card-body">
                <form th:action="@{/mis-estudiantes/{id}/seguimiento/guardar(id=${estudiante.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select class="form-select" name="tipo" required>
                            <option value="">-- Selecciona --</option>
                            <option th:each="t : ${tipos}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Valoración (1 a 5)</label>
                        <input type="number" class="form-control" name="valoracion" min="1" max="5" required />
                    </div>

                    <div class="mb-3" id="campoApto" style="display:none;">
                        <label class="form-label">¿Apto?</label>
                        <select class="form-select" name="apto">
                            <option value="">-- No indicar --</option>
                            <option value="true">Sí</option>
                            <option value="false">No</option>
                        </select>
                    </div>

                    <script>
                        document.querySelector('select[name="tipo"]').addEventListener('change', function () {
                            document.getElementById('campoApto').style.display =
                                this.value === 'FINAL' ? 'block' : 'none';
                        });
                    </script>

                    <div class="mb-3">
                        <label class="form-label">Observaciones</label>
                        <textarea class="form-control" name="observaciones" rows="4" maxlength="1000"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Guardar seguimiento</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
