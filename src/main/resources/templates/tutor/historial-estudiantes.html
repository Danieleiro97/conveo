<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Mi historial de estudiantes')}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0">Mi historial de estudiantes</h1>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Estudiante</th>
                                <th>Email</th>
                                <th>Centro</th>
                                <th style="width: 140px;">Inicio asignación</th>
                                <th style="width: 140px;">Fin asignación</th>
                                <th style="width: 140px;">Estado</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:if="${#lists.isEmpty(historial)}">
                                <td colspan="6" class="text-center py-4">
                                    No hay histórico todavía.
                                </td>
                            </tr>

                            <tr th:each="h : ${historial}">
                                <td th:text="${h.estudiante.nombre + ' ' + h.estudiante.apellidos}"></td>
                                <td th:text="${h.estudiante.email}"></td>
                                <td th:text="${h.estudiante.centro != null ? h.estudiante.centro.nombre : '—'}"></td>

                                <td
                                    th:text="${h.fechaInicio != null ? #temporals.format(h.fechaInicio,'dd/MM/yyyy') : '—'}">
                                </td>
                                <td th:text="${h.fechaFin != null ? #temporals.format(h.fechaFin,'dd/MM/yyyy') : '—'}">
                                </td>

                                <td>
                                    <span class="badge"
                                        th:classappend="${h.fechaFin == null ? ' bg-success' : ' bg-secondary'}"
                                        th:text="${h.fechaFin == null ? 'ACTIVA' : 'FINALIZADA'}">
                                    </span>
                                </td>
                            </tr>
                        </tbody>

                    </table>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
