<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Mis estudiantes')}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0">Mis estudiantes</h1>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th>Centro</th>
                                <th>Titulación</th>
                                <th style="width:130px;">Inicio</th>
                                <th style="width:130px;">Fin</th>
                                <th style="width:130px;">Días restantes</th>
                                <th style="width: 110px;">Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:if="${#lists.isEmpty(estudiantes)}">
                                <td colspan="7" class="text-center py-4">
                                    No tienes estudiantes asignados actualmente.
                                </td>
                            </tr>

                            <tr th:each="e : ${estudiantes}">
                                <td th:text="${e.nombre + ' ' + e.apellidos}"></td>
                                <td th:text="${e.email}"></td>
                                <td th:text="${e.centro != null ? e.centro.nombre : '—'}"></td>
                                <td th:text="${e.titulacion != null ? e.titulacion.nombre : '—'}"></td>
                                <td
                                    th:text="${e.fechaInicioPracticas != null ? #temporals.format(e.fechaInicioPracticas,'dd/MM/yyyy') : '—'}">
                                </td>
                                <td
                                    th:text="${e.fechaFinPracticas != null ? #temporals.format(e.fechaFinPracticas,'dd/MM/yyyy') : '—'}">
                                </td>
                                <td>
                                    <span th:if="${diasRestantesMap[e.id] == null}" class="text-muted">—</span>
                                    <span th:if="${diasRestantesMap[e.id] != null}" class="badge" th:classappend="${diasRestantesMap[e.id] < 0 ? ' bg-secondary' :
                           diasRestantesMap[e.id] <= 7 ? ' bg-danger' :
                           diasRestantesMap[e.id] <= 15 ? ' bg-warning text-dark' : ' bg-success'}"
                                        th:text="${diasRestantesMap[e.id] < 0 ? 'Finalizado' : diasRestantesMap[e.id] + ' días'}">
                                    </span>
                                </td>
                                <td>
                                    <div class="d-flex gap-2">
                                        <a class="btn btn-sm btn-outline-secondary"
                                            th:href="@{/mis-estudiantes/{id}(id=${e.id})}">
                                            Ver ficha
                                        </a>
                                        <a class="btn btn-sm btn-outline-primary"
                                            th:href="@{/mis-estudiantes/{id}/seguimiento/nuevo(id=${e.id})}">
                                            Añadir Seguimiento
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>

                    </table>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
