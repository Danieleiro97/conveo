<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head(${tutor.id == null ? 'Nuevo Tutor Empresa' : 'Editar Tutor Empresa'})}">
</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0" th:text="${tutor.id == null ? 'Nuevo Tutor Empresa' : 'Editar Tutor Empresa'}"></h1>

            <a class="btn btn-outline-secondary" th:href="@{/tutores-empresa}">
                Volver
            </a>
        </div>

        <div class="card">
            <div class="card-body">

                <form th:action="@{/tutores-empresa/guardar}" th:object="${tutor}" method="post" class="row g-3">

                    <input type="hidden" th:field="*{id}" />

                    <div class="col-12 col-md-6">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" placeholder="Nombre" />
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Apellidos</label>
                        <input type="text" class="form-control" th:field="*{apellidos}" placeholder="Apellidos" />
                    </div>

                    <div class="col-12 col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" th:field="*{email}" placeholder="email@empresa.com" />
                    </div>

                    <div class="col-12 col-md-3">
                        <label class="form-label">DNI</label>
                        <input type="text" class="form-control" th:field="*{dni}" placeholder="DNI" />
                    </div>

                    <div class="col-12 col-md-3">
                        <label class="form-label">Cargo</label>
                        <input type="text" class="form-control" th:field="*{cargoEmpresa}"
                            placeholder="Cargo en la empresa" />
                    </div>

                    <div class="col-12" th:if="${tutor.id == null}">
                        <hr class="my-2" />
                        <h5 class="mb-3">Acceso</h5>

                        <div class="col-12 col-md-6">
                            <label class="form-label">Contraseña (login)</label>
                            <input type="password" class="form-control" name="password"
                                placeholder="Contraseña inicial" />
                            <div class="form-text">
                                Solo se solicita al crear un tutor nuevo.
                            </div>
                        </div>
                    </div>

                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-success">Guardar</button>
                        <a class="btn btn-outline-secondary" th:href="@{/tutores-empresa}">Cancelar</a>
                    </div>

                </form>

            </div>
        </div>

    </div>

</body>

</html>
