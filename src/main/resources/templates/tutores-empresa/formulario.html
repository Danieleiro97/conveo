<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Tutor Empresa</title>
</head>

<body>

    <div th:replace="fragments/navbar :: navbar"></div>

    <h1 th:text="${tutor.id == null ? 'Nuevo Tutor Empresa' : 'Editar Tutor Empresa'}"></h1>

    <form th:action="@{/tutores-empresa/guardar}" th:object="${tutor}" method="post">

        <input type="hidden" th:field="*{id}" />

        <label>Nombre:</label>
        <input type="text" th:field="*{nombre}" /><br />

        <label>Apellidos:</label>
        <input type="text" th:field="*{apellidos}" /><br />

        <label>Email:</label>
        <input type="email" th:field="*{email}" /><br />

        <label>DNI:</label>
        <input type="text" th:field="*{dni}" /><br />

        <label>Cargo:</label>
        <input type="text" th:field="*{cargoEmpresa}" /><br />

        <div th:if="${tutor.id == null}">
            <label>Contraseña (login):</label>
            <input type="password" name="password" /><br />
        </div>

        <button type="submit">Guardar</button>
    </form>

    <a th:href="@{/tutores-empresa}">Volver</a>

</body>

</html>
