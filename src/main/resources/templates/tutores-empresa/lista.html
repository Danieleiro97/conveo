<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/head :: head('Tutores Empresa')}"></head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="mb-0">Tutores Empresa</h1>

            <a class="btn btn-primary" sec:authorize="hasRole('ADMIN')" th:href="@{/tutores-empresa/nuevo}">
                Nuevo Tutor Empresa
            </a>
        </div>

        <!-- Mensajes OK / Error -->
        <div th:if="${mensajeOk != null}" class="alert alert-success" role="alert">
            <span th:text="${mensajeOk}"></span>
        </div>

        <div th:if="${mensajeError != null}" class="alert alert-danger" role="alert">
            <span th:text="${mensajeError}"></span>
        </div>

        <div class="card">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0 align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>Nombre</th>
                                <th>Email</th>
                                <th style="width: 140px;">DNI</th>
                                <th>Cargo</th>
                                <th style="width: 100px;">Estado</th>
                                <th style="width: 360px;">Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr th:if="${#lists.isEmpty(tutores)}">
                                <td colspan="6" class="text-center py-4">
                                    No hay tutores de empresa registrados.
                                </td>
                            </tr>

                            <tr th:each="t : ${tutores}">
                                <td th:text="${t.nombre + ' ' + t.apellidos}"></td>
                                <td th:text="${t.email}"></td>
                                <td th:text="${t.dni}"></td>
                                <td th:text="${t.cargoEmpresa != null ? t.cargoEmpresa : '—'}"></td>
                                <td>
                                    <span class="badge" th:classappend="${t.activo ? ' bg-success' : ' bg-secondary'}"
                                        th:text="${t.activo ? 'ACTIVO' : 'BAJA'}">
                                    </span>
                                </td>
                                <td>
                                    <div class="d-flex flex-wrap gap-2">

                                        <a class="btn btn-sm btn-outline-primary" sec:authorize="hasRole('ADMIN')"
                                            th:href="@{/tutores-empresa/editar/{id}(id=${t.id})}">
                                            Editar
                                        </a>

                                        <a class="btn btn-sm btn-outline-secondary" th:if="${!t.activo}"
                                            th:href="@{/tutores-empresa/activar/{id}(id=${t.id})}">
                                            Activar
                                        </a>

                                        <a class="btn btn-sm btn-outline-warning" th:if="${t.activo}"
                                            th:href="@{/tutores-empresa/desactivar/{id}(id=${t.id})}"
                                            onclick="return confirm('¿Desactivar tutor? No se borrará, quedará como histórico y no podrá iniciar sesión.');">
                                            Desactivar
                                        </a>

                                        <a class="btn btn-sm btn-outline-info"
                                            th:href="@{/tutores-empresa/{id}/historial-estudiantes(id=${t.id})}">
                                            Historial estudiantes
                                        </a>

                                    </div>
                                </td>

                            </tr>
                        </tbody>

                    </table>
                </div>
            </div>
        </div>

    </div>

</body>

</html>
